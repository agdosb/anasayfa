    <script>

    </script>

    <div id="login-gate" role="dialog" aria-modal="true" aria-labelledby="login-heading">

    <!-- =========================================================
         OTURUM VE ŞİFRE DOĞRULAMA BETİĞİ
    ========================================================== -->
    <script>
        (function () {
            const SESSION_KEY = "agdosb_auth_verified";
            const loginGate = document.getElementById("login-gate");
            const portalWrapper = document.getElementById("portal-wrapper");
            const loginForm = document.getElementById("login-form");
            const passwordInput = document.getElementById("password-input");
            const passwordWrapper = document.getElementById("password-wrapper");
            const errorMessage = document.getElementById("error-message");
            const togglePasswordBtn = document.getElementById("toggle-password");
            const eyeOpenIcon = document.getElementById("eye-open-icon");
            const eyeClosedIcon = document.getElementById("eye-closed-icon");
            const logoutBtn = document.getElementById("logout-btn");

            // Portalı görünür kılan fonksiyon
            function unlockPortal(instant) {
                if (instant) {
                    loginGate.style.transition = "none";
                }
                loginGate.classList.add("hidden-gate");
                portalWrapper.classList.add("portal-visible");
                if (instant) {
                    // Bir sonraki geçiş animasyonu için transition'ı geri yükle
                    requestAnimationFrame(() => {
                        loginGate.style.transition = "";
                    });
                }
            }

            // Portalı kilitleyen fonksiyon
            function lockPortal() {
                sessionStorage.removeItem(SESSION_KEY);
                passwordInput.value = "";
                passwordInput.classList.remove("input-error");
                errorMessage.classList.remove("visible");
                portalWrapper.classList.remove("portal-visible");
                loginGate.classList.remove("hidden-gate");
                setTimeout(() => passwordInput.focus(), 100);
            }

            // Sayfa yüklendiğinde oturum kontrolü
            if (sessionStorage.getItem(SESSION_KEY) === "true") {
                unlockPortal(true);
            } else {
                window.addEventListener("DOMContentLoaded", () => {
                    passwordInput.focus();
                });
            }

            // Şifreyi göster / gizle göz ikonu
            togglePasswordBtn.addEventListener("click", () => {
                const isPassword = passwordInput.type === "password";
                passwordInput.type = isPassword ? "text" : "password";
                eyeOpenIcon.style.display = isPassword ? "none" : "block";
                eyeClosedIcon.style.display = isPassword ? "block" : "none";
                passwordInput.focus();
            });

            // Kullanıcı yazmaya başladığında hata durumunu temizle
            passwordInput.addEventListener("input", () => {
                if (passwordInput.classList.contains("input-error")) {
                    passwordInput.classList.remove("input-error");
                    errorMessage.classList.remove("visible");
                }
            });

            // Form gönderimi ve şifre doğrulama (Enter veya Buton)
            loginForm.addEventListener("submit", (e) => {
                e.preventDefault();
                const enteredPassword = passwordInput.value;

                if (enteredPassword === SIFRE) {
                    sessionStorage.setItem(SESSION_KEY, "true");
                    errorMessage.classList.remove("visible");
                    passwordInput.classList.remove("input-error");
                    unlockPortal(false);
                } else {
                    passwordInput.classList.add("input-error");
                    errorMessage.classList.add("visible");
                    
                    // Titreme (shake) animasyonunu yeniden tetikle
                    passwordWrapper.classList.remove("shake-anim");
                    void passwordWrapper.offsetWidth;
                    passwordWrapper.classList.add("shake-anim");
                    
                    passwordInput.select();
                }
            });

            // Çıkış yap butonu
            logoutBtn.addEventListener("click", () => {
                lockPortal();
            });
        })();
    </script>
